[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
    --ignore-glob=**/migration.py
    --ignore-glob=**/seed.py
[coverage:run]
omit = 
    */migration.py
    */seed.py
    */__pycache__/*
    */tests/*
